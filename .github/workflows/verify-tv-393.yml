name: Verify MarkVault TV UI 5.4.393cc
on:
  push:
    paths:
      - '.github/workflows/verify-tv-393.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack and patch source
        shell: bash
        run: |
          rm -rf work
          mkdir work
          unzip -q source.zip -d work
          echo 'PLACEHOLDER' | base64 -d > /tmp/tv.patch
          cd work
          patch -p1 < /tmp/tv.patch
      - name: Compile release Kotlin
        run: gradle -p work :app:compileReleaseKotlin --no-daemon
