name: Repair and verify MarkVault 5.4.392cc v2

on:
  push:
    paths:
      - '.github/workflows/repair-build-392-v2.yml'

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch and repack clean source.zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project392
          mkdir project392
          unzip -q source.zip -d project392
          cd project392
          patch -p1 < ../.markvault_fix_5.4.392cc_v2.patch
          grep -q 'versionCode = 437' app/build.gradle.kts
          grep -q 'versionName = "5.4.392cc"' app/build.gradle.kts
          ! grep -q '_globalMediaResults' app/src/main/java/com/tebogo/markvault/AppViewModel.kt
          cd ..
          rm -f source.zip
          cd project392
          zip -qr ../source.zip .
          cd ..
          unzip -t source.zip >/dev/null

      - name: Compile release APK
        shell: bash
        run: |
          set -euo pipefail
          cd project392
          gradle assembleRelease --no-daemon

      - name: Commit verified clean source.zip
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MarkVault Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .markvault_fix_5.4.392cc.patch .github/workflows/repair-build-392.yml .markvault_fix_5.4.392cc_v2.patch .github/workflows/repair-build-392-v2.yml
          git add source.zip
          git commit -m 'MarkVault 5.4.392cc: verified compile fix'
          git push origin HEAD:main
