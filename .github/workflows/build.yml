      - name: Verify
        run: |
          grep -n "versionCode\|versionName" project/app/build.gradle.kts
          node --check project/app/src/main/assets/render.js
      - name: Build
        run: cd project && gradle assembleRelease --no-daemon
      - name: Collect
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk MarkVault-5.5.22.apk
          cd project && zip -qr ../source-5.5.22.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.22
          path: |
            MarkVault-5.5.22.apk
            source-5.5.22.zip
