name: Build MarkVault 5.5.22 APK

on:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip exact 5.5.20 source
        run: unzip -o -q source.zip -d project
      - name: Apply exact 5.5.22 patch
        run: |
          base64 -d tmp/mv5522.patch.gz.b64 > /tmp/mv5522.patch.gz
          gzip -dc /tmp/mv5522.patch.gz | patch -p1 -d project
      - name: Verify
        run: |
          grep -n "versionCode\|versionName" project/app/build.gradle.kts
          node --check project/app/src/main/assets/render.js
          grep -n "mark:not(.term-hit):not(.llm-hit)" project/app/src/main/java/com/tebogo/markvault/ui/ThemeBridge.kt
          grep -n "mv-highlight-contrast-style" project/app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt | head -1
      - name: Build APK
        run: cd project && gradle assembleRelease --no-daemon
      - name: Collect
        run: cp project/app/build/outputs/apk/release/app-release.apk MarkVault-5.5.22.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.22-APK
          path: MarkVault-5.5.22.apk
