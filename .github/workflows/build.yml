name: Build MarkVault 5.5.22 APK
# retry build

on:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 5.5.20 baseline
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip source
        run: unzip -o -q source.zip -d project

      - name: Apply verified 5.5.22 contrast patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/mv5522.patch
          patch -p1 -d project < /tmp/mv5522.patch

      - name: Verify version and contrast wiring
        run: |
          grep -n "versionCode\|versionName" project/app/build.gradle.kts
          grep -n "mark:not(.term-hit):not(.llm-hit)" project/app/src/main/java/com/tebogo/markvault/ui/ThemeBridge.kt
          grep -n "mv-highlight-contrast-style" project/app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt | head -1
          grep -n "#content mark.term-hit" project/app/src/main/assets/viewer.css | head -1

      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon

      - name: Package patched source
        run: cd project && zip -qr ../source-5.5.22.zip .

      - name: Collect APK
        run: cp project/app/build/outputs/apk/release/app-release.apk MarkVault-5.5.22.apk

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.22
          path: |
            MarkVault-5.5.22.apk
            source-5.5.22.zip
