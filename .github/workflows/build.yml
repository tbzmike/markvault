name: Build MarkVault 5.5.22 APK

on:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip source
        run: unzip -o -q source.zip -d project

      - name: Apply 5.5.22 contrast fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path("project")

          p=r/"app/build.gradle.kts"
          s=p.read_text()
          assert 'versionCode = 469' in s and 'versionName = "5.5.20"' in s
          p.write_text(s.replace('versionCode = 469','versionCode = 471',1).replace('versionName = "5.5.20"','versionName = "5.5.22"',1))

          p=r/"app/src/main/assets/viewer.css"
          s=p.read_text()
          old="""/* ===== Jump-to-match highlight (from search) ===== */
          .term-hit {
            background: rgba(255,213,79,.85); color: #1a1a1a;
            border-radius: 3px; padding: 0 1px;
          }
          .term-hit.flash { animation: termFlash .6s ease 0s 3; }
          @keyframes termFlash {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,213,79,0); background: rgba(255,213,79,.85); }
            50%      { box-shadow: 0 0 0 5px rgba(255,213,79,.5); background: #ffe082; }
          }
          body.theme-sepia .term-hit, body.theme-light .term-hit { background: #ffe082; color:#1a1a1a; }
          /* v5.5.16 — Semantic sentence fallback for passages split by inline links.
             The whole containing block is softly highlighted so Auto/Smart remains
             passage-oriented instead of degrading to one incidental keyword. */
          .semantic-passage-hit {
            background: rgba(255,213,79,.28);
            box-shadow: inset 3px 0 0 rgba(255,213,79,.9);
            border-radius: 4px;
          }
          .semantic-passage-hit.flash { animation: termFlash .6s ease 0s 3; }
          """
          new="""/* ===== Jump-to-match highlight (from search) =====
           * v5.5.22 — Dynamic MarkVault highlights own BOTH sides of the contrast pair.
           * Obsidian/community themes may style generic <mark> elements later in the
           * cascade, so search highlights use stronger selectors + !important and also
           * pin -webkit-text-fill-color. This keeps them readable in every built-in
           * light/dark theme and prevents nested theme styles from turning the text pale.
           */
          #content span.term-hit,
          #content mark.term-hit {
            background: #ffe066 !important;
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
            border-radius: 3px;
            padding: 0 1px;
          }
          #content .term-hit *,
          #content mark.term-hit * {
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
          }
          .term-hit.flash { animation: termFlash .6s ease 0s 3; }
          @keyframes termFlash {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,213,79,0); background: #ffe066; }
            50%      { box-shadow: 0 0 0 5px rgba(255,213,79,.5); background: #ffe082; }
          }
          /* v5.5.16 / v5.5.22 — Semantic sentence fallback for passages split by
             inline links. Use an opaque darker-yellow surface with a fixed dark ink so
             the contrast does not depend on whatever theme sits underneath it. */
          #content .semantic-passage-hit {
            background: #c9b44c !important;
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
            box-shadow: inset 3px 0 0 #ffd54f !important;
            border-radius: 4px;
          }
          #content .semantic-passage-hit * {
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
          }
          #content .semantic-passage-hit span.term-hit,
          #content .semantic-passage-hit mark.term-hit {
            background: #ffe066 !important;
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
          }
          .semantic-passage-hit.flash { animation: termFlash .6s ease 0s 3; }
          """
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace(""".llm-hit {
            background: rgba(255,105,180,.65);
            color: #1a1a1a;
            border-radius: 3px;
            padding: 0 2px;
            animation: llmFlash 1.8s ease-in-out infinite;
          }
          body.theme-sepia .llm-hit, body.theme-light .llm-hit {
            background: rgba(219,39,119,.52);
            color: #1a1a1a;
          }""","""#content .llm-hit {
            background: rgba(255,105,180,.72) !important;
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
            border-radius: 3px;
            padding: 0 2px;
            animation: llmFlash 1.8s ease-in-out infinite;
          }
          #content .llm-hit * {
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
            text-shadow: none !important;
          }
          body.theme-sepia #content .llm-hit, body.theme-light #content .llm-hit {
            background: rgba(255,105,180,.72) !important;
            color: #111111 !important;
            -webkit-text-fill-color: #111111 !important;
          }""",1)
          p.write_text(s)

          p=r/"app/src/main/java/com/tebogo/markvault/ui/ThemeBridge.kt"
          s=p.read_text()
          old="""    #content mark {
                  background: var(--text-highlight-bg, var(--mark-bg));
                  color: var(--text-highlight-fg, var(--mark-fg));
              }"""
          new="""    /* v5.5.22 — Theme generic author highlights only. Runtime search/LLM
                 marks own their contrast in viewer.css and must never inherit an
                 arbitrary community-theme text-highlight foreground. */
              #content mark:not(.term-hit):not(.llm-hit) {
                  background: var(--text-highlight-bg, var(--mark-bg));
                  color: var(--text-highlight-fg, var(--mark-fg));
              }"""
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=r/"app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt"
          s=p.read_text()
          needle="""            var isPhrase = $phraseFlag;
                      if (!raw || raw.length < 2) return;

                      var STOP ="""
          insert="""            var isPhrase = $phraseFlag;
                      if (!raw || raw.length < 2) return;

                      if (!document.getElementById('mv-highlight-contrast-style')) {
                        var contrastStyle = document.createElement('style');
                        contrastStyle.id = 'mv-highlight-contrast-style';
                        contrastStyle.textContent =
                          'mark.mv-hl{background:#ffe066!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;padding:0 2px!important;border-radius:2px!important}' +
                          'mark.mv-hl *{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}' +
                          'mark.mv-llm-hl{background:rgba(255,105,180,.72)!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}' +
                          'mark.mv-llm-hl *{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}' +
                          '.mv-semantic-passage-hit{background:#c9b44c!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;box-shadow:inset 3px 0 0 #ffd54f!important;border-radius:4px!important}' +
                          '.mv-semantic-passage-hit *{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}' +
                          '.mv-semantic-passage-hit mark.mv-hl{background:#ffe066!important;color:#111!important;-webkit-text-fill-color:#111!important}';
                        (document.head || document.documentElement).appendChild(contrastStyle);
                      }

                      var STOP ="""
          assert needle in s
          s=s.replace(needle,insert,1)
          s=s.replace("m.style.cssText = 'background:#ffe066;color:#000;padding:0 2px;border-radius:2px'","m.style.cssText = 'background:#ffe066!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;padding:0 2px!important;border-radius:2px!important'")
          s=s.replace("m.style.cssText='background:#ffe066;color:#000;padding:0 2px;border-radius:2px'","m.style.cssText='background:#ffe066!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;padding:0 2px!important;border-radius:2px!important'")
          old=".mv-semantic-passage-hit{background:rgba(255,224,102,.30)!important;box-shadow:inset 3px 0 0 rgba(255,213,79,.92)!important;border-radius:4px}"
          new=".mv-semantic-passage-hit{background:#c9b44c!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;box-shadow:inset 3px 0 0 #ffd54f!important;border-radius:4px!important}.mv-semantic-passage-hit *{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}.mv-semantic-passage-hit mark.mv-hl{background:#ffe066!important;color:#111!important;-webkit-text-fill-color:#111!important}"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("background:rgba(255,224,102,.30)}50%{background:rgba(255,224,102,.62)}","background:#c9b44c}50%{background:#ffe082}",1)
          s=s.replace("m.style.cssText = 'background:rgba(255,105,180,.65);color:#1a1a1a;padding:0 2px;border-radius:3px;animation:mvLlmFlash 1.8s ease-in-out infinite;'","m.style.cssText = 'background:rgba(255,105,180,.72)!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;padding:0 2px!important;border-radius:3px!important;animation:mvLlmFlash 1.8s ease-in-out infinite;'",1)
          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          grep -n "versionCode\|versionName" project/app/build.gradle.kts
          grep -n "mark:not(.term-hit):not(.llm-hit)" project/app/src/main/java/com/tebogo/markvault/ui/ThemeBridge.kt
          grep -n "mv-highlight-contrast-style" project/app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt | head -1
          grep -n "#content mark.term-hit" project/app/src/main/assets/viewer.css | head -1

      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon

      - name: Package output
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk MarkVault-5.5.22.apk
          cd project && zip -qr ../source-5.5.22.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.22
          path: |
            MarkVault-5.5.22.apk
            source-5.5.22.zip
