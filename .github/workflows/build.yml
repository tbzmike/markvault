name: Export MarkVault 5.5.18 source

on:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Get exact 5.5.18 repository snapshot
        uses: actions/checkout@v4

      - name: Upload exact source.zip
        uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.18-source
          path: source.zip
