name: Build MarkVault 5.5.21 APK

on:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 5.5.20 baseline
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip source
        run: unzip -o -q source.zip -d project

      - name: Apply 5.5.21 readability-only patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("project/app/build.gradle.kts")
          s=p.read_text()
          assert 'versionCode = 469' in s
          assert 'versionName = "5.5.20"' in s
          s=s.replace('versionCode = 469','versionCode = 470',1)
          s=s.replace('versionName = "5.5.20"','versionName = "5.5.21"',1)
          p.write_text(s)

          p=Path("project/app/src/main/assets/viewer.css")
          s=p.read_text()
          old='''.semantic-passage-hit {
            background: rgba(255,213,79,.28);
            box-shadow: inset 3px 0 0 rgba(255,213,79,.9);
            border-radius: 4px;
          }'''
          new='''.semantic-passage-hit {
            background: rgba(255,213,79,.28);
            color: #1a1a1a;
            box-shadow: inset 3px 0 0 rgba(255,213,79,.9);
            border-radius: 4px;
          }'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path("project/app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt")
          s=p.read_text()
          old=".mv-semantic-passage-hit{background:rgba(255,224,102,.30)!important;box-shadow:inset 3px 0 0 rgba(255,213,79,.92)!important;border-radius:4px}"
          new=".mv-semantic-passage-hit{background:rgba(255,224,102,.30)!important;color:#1a1a1a!important;box-shadow:inset 3px 0 0 rgba(255,213,79,.92)!important;border-radius:4px}"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify patch scope
        run: |
          grep -n "versionCode\|versionName" project/app/build.gradle.kts
          grep -n -A5 "semantic-passage-hit" project/app/src/main/assets/viewer.css | head -10
          grep -n "mv-semantic-passage-hit{background" project/app/src/main/java/com/tebogo/markvault/ui/HtmlReaderScreen.kt | head -1

      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon

      - name: Collect APK
        run: cp project/app/build/outputs/apk/release/app-release.apk MarkVault-5.5.21.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkVault-5.5.21-APK
          path: MarkVault-5.5.21.apk
