name: Apply MarkVault source.zip update

on:
  push:
    paths:
      - '.github/workflows/apply-markvault-zip.yml'

permissions:
  contents: write

jobs:
  update-source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch to source.zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .markvault_zip_work
          mkdir .markvault_zip_work
          unzip -q source.zip -d .markvault_zip_work
          cd .markvault_zip_work
          patch -p1 < ../.markvault_update_5.4.391cc.patch
          grep -q 'versionCode = 436' app/build.gradle.kts
          grep -q 'versionName = "5.4.391cc"' app/build.gradle.kts
          zip -qr ../source.zip .
          cd ..
          unzip -t source.zip >/dev/null
          rm -rf .markvault_zip_work
      - name: Commit updated archive and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MarkVault Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .markvault_update_5.4.391cc.patch .github/workflows/apply-markvault-zip.yml
          git add source.zip
          git commit -m 'MarkVault 5.4.391cc: caption deletion and media cache controls'
          git push
